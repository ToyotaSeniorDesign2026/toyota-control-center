services:
  postgres:
    image: postgres:16
    container_name: control_center_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: control_center
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: .
    container_name: control_center_api
    restart: unless-stopped
    depends_on:
      - postgres
    env_file: .env
    environment:
      APP_NAME: Toyota Control Center API
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/control_center
      DB_ECHO: "false"
      DB_SSL_MODE: local
      DB_POOL_SIZE: "10"
      DB_MAX_OVERFLOW: "20"
      DB_POOL_RECYCLE: "1800"
      DB_POOL_PRE_PING: "true"
      # Demo-jobs seeding mode: auto (skip if demo jobs exist),
      # replace (wipe + reseed), force (add on top). Override via shell:
      #   SEED_DEMO_JOBS=replace docker compose up --build
      SEED_DEMO_JOBS: "${SEED_DEMO_JOBS:-auto}"
      # Self-reference for the control-center MCP server. When the agent
      # spawns control-center as a subprocess, it calls back to this same
      # API container. localhost:8000 resolves inside the container.
      CC_API_BASE_URL: "http://localhost:8000"
      # Bearer token the MCP server uses when calling the API. The seeded
      # u_analyst user's id IS its access token (see auth/login).
      CC_USER_TOKEN: "${CC_USER_TOKEN:-u_analyst}"
    volumes:
      - ./mcp_servers/sql-mcp-server:/app/mcp_servers/sql-mcp-server
      - ./mcp_servers/control-center-server:/app/mcp_servers/control-center-server
    ports:
      - "8000:8000"
    command: >
      sh -c "until pg_isready -h postgres -U postgres; do sleep 1; done &&
             alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

volumes:
  postgres_data:
