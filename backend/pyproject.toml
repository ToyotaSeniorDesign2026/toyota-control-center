[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "toyota-control-center-backend"
version = "0.1.0"
description = "Toyota Control Center backend"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pydantic>=2.6",
  "email-validator>=2.1",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "psycopg[binary]>=3.1",
]

[tool.uv]
dev-dependencies = [
  "pytest>=8.0",
  "httpx>=0.27",
]

[tool.setuptools]
packages = ["app"]
