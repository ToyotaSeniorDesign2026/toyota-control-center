[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "toyota-control-center-backend"
version = "0.1.0"
description = "Toyota Control Center backend"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pydantic>=2.6",
  "email-validator>=2.1",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "psycopg[binary]>=3.1",
  "mcp>=1.26.0",
  "fastmcp>=3.1.0",
  "google-genai>=1.65.0",
  "instructor>=1.7.0",
  "python-dotenv>=1.2.2",
  "arxiv>=2.4.0",
  "openai>=1.0.0",
  "httpx>=0.27",
]

[project.optional-dependencies]
snowflake = ["snowflake-sqlalchemy>=1.6"]

[dependency-groups]
dev = ["pytest>=8.0", "httpx>=0.27"]

[tool.setuptools]
[tool.setuptools.packages.find]
where = ["src"]
include = ["app*", "control_center*"]
